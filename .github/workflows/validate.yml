name: Validate static app

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect embedded sample workbook
        run: python3 tools/inspect_sample_workbook.py
      - name: Check JavaScript syntax
        run: find js tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Run automated tests
        run: node --test tests/*.test.mjs
