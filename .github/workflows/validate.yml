name: Validate static app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: find js tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Run automated tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          exit $status
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-test-output
          path: test-output.txt
          retention-days: 1
