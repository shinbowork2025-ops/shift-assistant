name: Validate static app

on:
  pull_request:
  push:
    branches:
      - main
      - feature/monthly-solver-v2

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: monthly-solver-source
          path: |
            .github
            docs
            js
            tests
            index.html
            styles.css
            README.md
          retention-days: 1
      - name: Check JavaScript syntax
        run: find js tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Run automated tests
        run: node --test tests/*.test.mjs
