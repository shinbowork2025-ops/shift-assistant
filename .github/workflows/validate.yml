name: Validate static app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: find js tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Run automated tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tail -n 220
